<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquire Store | Login</title>
  <link rel="icon" type="image/png" href="INQUIRE logo.jpeg" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-page">
  <a href="index.html" class="hero-btn hero-btn-outline">Back to Home</a>
  <main class="login-card">
    <div class="brand">
      <img src="INQUIRE logo.jpeg" alt="Inquire Store logo" />
      <h1>INQUIRE STORE</h1>
      <p>Sign in to your account</p>
    </div>

    <form id="loginForm" action="#" method="post" novalidate>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>

      <div class="meta">
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" name="remember" />
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn" type="submit">LOGIN</button>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <p class="signup">New to Inquire Store? <a href="create account.html">Create account</a></p>
    </form>
  </main>
  <script>
    const loginForm = document.getElementById("loginForm");
    const feedback = document.getElementById("feedback");

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const validPassword = password.length >= 6;

      if (!validEmail || !validPassword) {
        feedback.textContent = "Enter a valid email and password (minimum 6 characters).";
        feedback.style.color = "#ff7b7b";
        return;
      }

      try {
        const response = fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const body =  response.json();
        if (!response.ok) {
          throw new Error(body.error || 'Login failed.');
        }

        feedback.textContent = body.message || 'Login successful. Redirecting...';
        feedback.style.color = '#8de1b8';
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 800);
      } catch (error) {
        feedback.textContent = error.message;
        feedback.style.color = '#ff7b7b';
      }
    });
  </script>
</body>

</html>
